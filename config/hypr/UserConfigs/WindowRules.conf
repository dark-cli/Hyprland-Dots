# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# ============================================
# CUSTOM WINDOW RULES - Migrated from v2.3.13
# ============================================

# Custom workspace assignments
windowrulev2 = workspace 10, class:^(discord)$
windowrulev2 = workspace 10, class:^(org.telegram.desktop)$
windowrulev2 = workspace 10, class:^(Spotify)$
windowrulev2 = workspace 10, class:^(feishin)$

# Opacity overrides (if you want different from defaults)
# windowrulev2 = opacity 0.9 0.7, tag:browser*

# Custom layer rules
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
